services:
  api:
    build: ./API/
    command: sh -c "sleep 10s ; python3 app.py"
    depends_on:
      - mysql
    ports:
      - "5001:5001"
    volumes:
      - ./API:/app
    working_dir: /app
    env_file:
      - ./API/.env-docker

  front:
    build: ./Frontend/
    command: sh -c "python3 app.py"
    depends_on:
      - api
    ports:
        - "5000:5000"
    volumes:
      - ./Frontend:/app
    working_dir: /app
    env_file:
      - ./Frontend/.env-docker

  mysql:
    build: ./API/database/
    restart: always    
    environment:
        MYSQL_ROOT_PASSWORD: 'pass'
        MYSQL_DATABASE: 'adminprop'
        MYSQL_USER: 'user'
        MYSQL_PASSWORD: 'pass'
    volumes:
      - ./API/database:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    command: ['--event-scheduler=ON']

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      #PMA_USER: user
      #PMA_PASSWORD: pass
    depends_on:
      - mysql

volumes:
  mysql-data:
